name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "11.0.x"
  RUST_VERSION: stable

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: "preview"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/NuGet.config', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-quality-rust-${{ env.RUST_VERSION }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-quality-rust-${{ env.RUST_VERSION }}-
            ${{ runner.os }}-quality-rust-

      - name: Restore dependencies
        run: dotnet restore

      - name: Check .NET format
        run: dotnet format --verify-no-changes --verbosity diagnostic --no-restore

      - name: Check Rust format
        working-directory: ./native
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        working-directory: ./native
        run: cargo clippy -- -D warnings

  publish:
    name: Publish ${{ matrix.artifact }}
    needs: code-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: wordlens-windows-x64
            os: windows-2025
            rid: win-x64
          - artifact: wordlens-linux-x64
            os: ubuntu-24.04
            rid: linux-x64
          - artifact: wordlens-macos-x64
            os: macos-15-intel
            rid: osx-x64
          - artifact: wordlens-macos-arm64
            os: macos-15
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: "preview"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux native dependencies
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.rid }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/NuGet.config', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rid }}-nuget-
            ${{ runner.os }}-nuget-

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: ${{ runner.os }}-${{ matrix.rid }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('native/Cargo.lock', 'native/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.rid }}-rust-${{ env.RUST_VERSION }}-
            ${{ runner.os }}-${{ matrix.rid }}-rust-

      - name: Restore dependencies
        run: dotnet restore WordLens/WordLens.csproj -r ${{ matrix.rid }}

      - name: Publish
        run: dotnet publish WordLens/WordLens.csproj -c Release -r ${{ matrix.rid }} -o ./publish/${{ matrix.rid }} --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./publish/${{ matrix.rid }}/
          if-no-files-found: error
          retention-days: 14
