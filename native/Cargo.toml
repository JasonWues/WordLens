[package]
name = "native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
selection = "1.2.0"
xcap = { version = "=0.9.6", features = ["wgc"] }

# Vision-based local OCR is macOS-only; keep these bindings out of the
# Windows/Linux dependency graph so non-Apple builds don't pull/compile them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[lib]
crate-type = ["cdylib", "staticlib"]
